#cloud-config
# First boot of the Say Less instance: install Docker, clone the public repo,
# discover the Cybera-assigned DNS name from instance metadata, and start the
# stack. Re-deploys are `deploy/deploy.sh` over SSH (git pull + compose up).
#
# Sized for m1.micro (1 vCPU, 1 GB RAM, 5 GB disk): swap keeps the in-place image
# build from being OOM-killed, and the apt caches and Docker build cache are both
# dropped once they have served their purpose so the root stays around 60% full.
package_update: true
package_upgrade: false
packages:
  - ca-certificates
  - curl
  - git
  - jq
  - ufw

write_files:
  - path: /usr/local/bin/say-less-bootstrap
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      exec > >(tee -a /var/log/say-less-bootstrap.log) 2>&1
      echo "== bootstrap $(date -Is)"

      # 1 GB of RAM is not enough to run `npm ci` and the Vite build. m1.micro
      # already attaches a 1 GB swap partition, so only fall back to a swapfile
      # if some future flavor does not -- on a 5 GB root the space matters more.
      if [ -z "$(swapon --show --noheadings)" ]; then
        fallocate -l 512M /swapfile
        chmod 600 /swapfile
        mkswap /swapfile
        swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      fi

      install -m 0755 -d /etc/apt/keyrings
      curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      . /etc/os-release
      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu ${VERSION_CODENAME} stable" \
        > /etc/apt/sources.list.d/docker.list
      apt-get update -qq
      apt-get install -y -qq docker-ce docker-ce-cli containerd.io docker-compose-plugin
      usermod -aG docker ubuntu
      # ~400 MB of apt caches on a 5 GB root, needed only during this install. The
      # daily apt timer would refill them, so also stop apt keeping what it downloads.
      printf 'APT::Keep-Downloaded-Packages "false";\nAcquire::Languages "none";\nAPT::Periodic::AutocleanInterval "1";\n' \
        > /etc/apt/apt.conf.d/99-say-less-lean
      apt-get clean
      rm -rf /var/lib/apt/lists/*

      ufw allow 22/tcp
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw --force enable

      if [ ! -d /opt/say-less/.git ]; then
        git clone --depth 1 https://github.com/ali-rafiei/say-less.git /opt/say-less
      fi
      chown -R ubuntu:ubuntu /opt/say-less

      # Cybera attaches a *.yeg.rac.sh name as server metadata; read it from the metadata service.
      DNS_NAME="$(curl -fsS --max-time 10 http://169.254.169.254/openstack/latest/meta_data.json | jq -r '.meta.dns // empty' || true)"
      if [ -z "${DNS_NAME}" ]; then
        echo "!! no dns metadata yet; serving plain HTTP until deploy.sh sets SITE_ADDRESS"
        DNS_NAME=":80"
      fi
      echo "SITE_ADDRESS=${DNS_NAME}" > /opt/say-less/deploy/.env
      chown ubuntu:ubuntu /opt/say-less/deploy/.env
      echo "== SITE_ADDRESS=${DNS_NAME}"

      cd /opt/say-less/deploy
      docker compose up -d --build
      # The build cache is ~800 MB and is worth more as free disk on a 5 GB root.
      docker builder prune -af >/dev/null
      echo "== bootstrap done $(date -Is)"

runcmd:
  - [/usr/local/bin/say-less-bootstrap]
