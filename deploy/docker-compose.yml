# Runs on the Cybera instance. Both services use host networking: Caddy binds :80/:443
# on the host's IPv4 and IPv6 directly, and the app listens on 127.0.0.1:8080 only, so it
# is reachable from Caddy and nothing else.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: say-less:latest
    restart: unless-stopped
    # Host networking so Caddy's connections arrive from 127.0.0.1: the per-IP room
    # limits trust X-Forwarded-For only from a loopback peer, and through Docker's port
    # mapping every peer would be the bridge gateway, putting all players in one bucket.
    network_mode: host
    environment:
      - PORT=8080
      - HOST=127.0.0.1
    # STATS_KEY (the private /stats page key) lives in this untracked file on the instance.
    env_file:
      - path: ./stats.env
        required: false
    volumes:
      - app_data:/data
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  app_data:
  caddy_data:
  caddy_config:
