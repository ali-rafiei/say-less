# Runs on the Cybera instance. Caddy uses host networking so it binds :80/:443
# on the host's IPv4 and IPv6 directly (no Docker port-publishing surprises);
# the app is only reachable from localhost.
services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: say-less:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - PORT=8080
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?set SITE_ADDRESS in deploy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  caddy_data:
  caddy_config:
